name: Build and test
on:
  push:
    branches: [main]
  pull_request:
# The token can only read the code: nothing here writes to the repository or its releases.
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0, the commit the v4 tag points to
      - name: Use the newest Xcode on the runner
        run: |
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Phew.xcodeproj -scheme Phew -configuration Debug build CODE_SIGNING_ALLOWED=NO | grep -E "error:|BUILD|\*\* " || true
          xcodebuild -project Phew.xcodeproj -scheme Phew -configuration Debug build CODE_SIGNING_ALLOWED=NO -quiet
      - name: Test
        run: xcodebuild -project Phew.xcodeproj -scheme Phew test CODE_SIGNING_ALLOWED=NO -quiet
